<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#214b3b"><title>行伴 · 每一程，都有照应</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="#journey"><svg viewBox="0 0 40 40" aria-hidden="true" style="stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round"><path d="M22 5H17C9.3 5 5 10.8 5 18.5V22c0 7.2 4.8 12 12 12h6V23" stroke="#285844"/><path d="M18 35h5c7.7 0 12-5.8 12-13.5V18c0-7.2-4.8-12-12-12h-6v11" stroke="#739383"/></svg><span>行伴<small>WAYMATE</small></span></a><span class="tagline">户外安全同行</span><div class="header-right"><span class="prototype">交互原型 · 全部为模拟数据</span><button id="network" class="network" data-action="demo"></button></div></header>
<main><aside id="panel"></aside><section class="map" aria-label="示意地形与行程地图"><div class="map-top"><div class="map-title"><h2>白沙湾海岸</h2><p>示意地图</p></div><div class="map-switch"><button data-action="mode" data-value="terrain" class="selected" id="terrain-btn">地形</button><button data-action="mode" data-value="flat" id="flat-btn">平面</button></div></div><div id="terrain" class="terrain"></div><div class="compass"><span>N</span><svg viewBox="0 0 40 50"><path d="M20 3 32 40 20 32 8 40Z" fill="#284b3c"/><path d="M20 3v29L8 40Z" fill="#fff"/></svg></div><div class="map-tools"><button data-action="zoom-in" aria-label="放大地图">+</button><button data-action="zoom-out" aria-label="缩小地图">−</button><button data-action="locate" aria-label="回到我的位置">⌖</button><button data-action="layers" aria-label="地图图层">▱</button></div><div id="map-notice" class="map-notice"></div><div class="map-bottom"><div class="legend"><span><i class="line"></i>计划路线</span><span><i class="dot"></i>我的位置</span><span><i class="dot amber"></i>附近队伍</span></div></div><div class="map-credit">行伴示意地形 / SVG · 非测绘数据 <span>└────┘ 500 m（示意）</span></div></section></main>
<nav class="bottom-nav" aria-label="主要导航"><button data-tab="journey"><span data-icon="shield"></span>安全</button><button data-tab="nearby"><span data-icon="people"></span>附近</button><button data-tab="profile"><span data-icon="map"></span>行程</button></nav>
